apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metal-store-frontend
  namespace: music-store
spec:
  hostnames:
  - metal-store.acme.gpu.set.lab
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: metal-store
    namespace: default
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: music-store-1-service
      port: 5000
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
